name: Build APKs

on:
  push:
    branches: [master, next]
    paths: ['src/**', 'assets/**', 'android/**', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          name=$(tr -d '[:space:]' < VERSION)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build the page and sync to Android
        run: |
          python3 src/build.py
          mkdir -p android/launcher/src/main/assets/fonts
          mkdir -p android/app/src/main/assets/fonts
          cp -r dist/* android/launcher/src/main/assets/ 2>/dev/null || true
          cp -r dist/* android/app/src/main/assets/ 2>/dev/null || true
          cp -f *.html *.js *.css android/launcher/src/main/assets/ 2>/dev/null || true
          cp -f *.html *.js *.css android/app/src/main/assets/ 2>/dev/null || true
          cp -rf assets/* android/launcher/src/main/assets/ 2>/dev/null || true
          cp -rf assets/* android/app/src/main/assets/ 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -alias urtv -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=UrTV, OU=Dev, O=UrTV, L=City, S=State, C=US"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=android123" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          URTV_BRANCH: ${{ github.ref_name }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk urtv-screensaver.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home.apk
          cp android/rescue/build/outputs/apk/release/rescue-release.apk urtv-rescue.apk
          echo "4.${{ github.run_number }}" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            urtv-screensaver.apk
            urtv-home.apk
            urtv-rescue.apk

      - name: Release notes
        if: github.ref_name == 'master'
        env:
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          echo "## UrTV ${NAME} (build ${GITHUB_RUN_NUMBER})" > release-notes.md

      - name: Publish to the apk-latest release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: UrTV ${{ steps.ver.outputs.name }} (latest)
          body_path: release-notes.md
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            urtv-rescue.apk
            version.txt
          make_latest: true
